 if(go&&(mode==='race'?fc>=tg||t>70:mode==='col'?t>=30:al<=tg||t>45))endRound()}

 mode=RD[ri][1];V=RD[ri][3];FZ={hill:-130,door:-90,tip:-68}[V]||0;t=0;cd=3.5;fc=0;tc=0;if(W)S.remove(W);W=new T.Group();S.add(W);build();

 setSt('result');const tg=RD[ri][2],a=ents.filter(e=>e.act),n=a.length;

 a.sort((x,y)=>y.s2-x.s2);a.forEach((e,i)=>{if(i>=tg){e.act=0;e.m.visible=false}});
 const P=ents[0],pos=a.indexOf(P)+1;[440,550,660].forEach((f,i)=>setTimeout(()=>sfx(P.act?f:f/3,.2),i*150));
